# Riddick VR autonomous worker - every 15 minutes, 24/7
# CI lane (no game install on runners): triage issues, full build, static checks.
# The game-dependent semi-play lane runs on the local 24/7 box (tools/vr-worker.ps1).
name: vr-worker

on:
  push:
    branches: [main, 'fix/**', 'docs/**']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  vr-work:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show oldest open issues
        run: |
          gh issue list --state open --limit 10 --json number,title --jq '.[] | "#\(.number) \(.title)"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (x64 host + Win32 proxy)
        run: powershell -ExecutionPolicy Bypass -File ./tools/build-all.ps1 -Config Release
      - name: VR math and combat-state tests (x64 + Win32)
        shell: powershell
        run: |
          $ctest = (Get-Command ctest -ErrorAction SilentlyContinue).Source
          if (-not $ctest) {
            $ctest = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\ctest.exe'
          }
          if (-not (Test-Path $ctest)) {
            $ctest = 'C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\ctest.exe'
          }
          & $ctest --test-dir build/x64 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'x64 VR tests failed' }
          & $ctest --test-dir build/x86 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Win32 VR tests failed' }
      - name: REA address-table self-test
        run: python tools/validate_addresses.py
      - name: MOS .xmd container structural tests (GH #55)
        run: python tools/test_mos_xmd.py
      - name: MOS .xmd mesh/skin export round-trip tests (GH #55)
        run: python tools/test_xmd_export.py
      - name: MOS .xmd-native hand mesh bake tests (GH #55 -> #46)
        run: python tools/test_xmd_bake.py
      - name: MOS .xsa animation-set structural tests (GH #58)
        run: python tools/test_xsa_anim.py
      - name: MOS .xmd cluster reference-pose / bind-pose tests (GH #46/#55)
        run: python tools/test_xmd_pose.py
      - name: Offline forward-kinematics / skinning tests (GH #58, ADR-0442)
        run: python tools/test_xmd_fk.py
      - name: MOS .xtc texture-pack structural tests (GH #61)
        run: python tools/test_mos_xtc.py
      - name: Native hand texture bake tests (GH #61)
        run: python tools/test_xtc_bake.py
      - name: XRSIM harness tests (GH #68)
        run: |
          python -m pip install --quiet --disable-pip-version-check numpy pillow
          python tools/test_xrsim.py
          python tools/xrsim.py --selftest
      - name: Hook-init regression test (GH #42)
        run: python tools/verify_hook_init.py
      - name: Scenario manifest validation (GH #48)
        run: python tools/scenario_tests.py --check
      - name: VR issue regression invariants (#40, #43-47)
        run: python tools/verify_reported_fixes.py
      - name: Verify 368-symbol OpenGL forwarder table intact
        shell: powershell
        run: |
          $f = (Select-String -Path src/hook/opengl_forwarders.c -Pattern 'DEFINE_FORWARDER\(' | Measure-Object).Count
          $d = (Select-String -Path src/hook/opengl32.def -Pattern '^\s+[A-Za-z]' | Measure-Object).Count
          $dll = Test-Path dist/opengl32.dll
          Write-Host "forwarders: $f, def exports: $d, dll present: $dll"
          if ($f -lt 350 -or $d -ne 368 -or -not $dll) { throw 'forwarder table check failed' }
      - name: Worker summary
        run: echo "CI lane green - game-dependent semi-play runs on local 24/7 box"
