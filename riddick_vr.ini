; Riddick VR configuration (Track C #10).
; Place next to opengl32.dll / DarkAthena.exe or in the working directory.
; Missing file or keys fall back to compiled defaults.
[VR]
; Snap turn step in degrees (15-90)
SnapAngleDeg=45
; Smooth turn curve gain (1-60)
SmoothTurnSpeed=20
; Left-stick radial deadzone (0.05-0.60)
MoveDeadzone=0.22
; Right-stick smooth-turn deadzone (0.05-0.60)
TurnDeadzone=0.20
; Dialogue/menu analog direction threshold (0.15-0.80)
DialogueDeadzone=0.50
; Interact button: 0 = face A (default), 1 = left Y (repurposes Eyeshine)
InteractButton=0
; GH #45: Head-look mouse sensitivity (50-2000). Tune these until
; head movement feels 1:1 with zero lag. Higher = faster in-game turn
; per degree of real head rotation.
LookSensitivityYaw=445.6
LookSensitivityPitch=445.6
; Comfort vignette proxy during move/turn (0/1) + gain (0-2) + max dim (0-1)
ComfortEnabled=1
ComfortStrength=1.0
ComfortMaxDim=0.45
; Seated mode: compensate eye height, disable physical auto-crouch (0/1)
Seated=0
SeatedEyeOffset=0.15
; Fixed standing eye-height baseline in meters (0 = auto-calibrate)
StandingEyeHeight=0
; World scale multiplier applied to interaction volumes + hand render (0.5-2.0)
WorldScale=1.0
; Southpaw: swap dominant/off-hand for aim/ADS/reload-waist/holster (0/1)
Southpaw=0
; Per-action gesture debounce in ms (clamped 120-250)
GestureDebounceMs=180
; GH #40: Diegetic ammo quad crop rect (fraction of swapchain, 0.0-1.0).
; Adjust if ammo digits are misaligned for your resolution/weapon.
AmmoQuadCropX=0.75
AmmoQuadCropY=0.75
AmmoQuadCropW=0.23
AmmoQuadCropH=0.23
; GH #40: Wrist HUD crop rect (fraction of swapchain, 0.0-1.0).
WristHudCropW=0.26
WristHudCropH=0.16
; GH #46: native Riddick arm/hand mesh (0 = procedural overlay, default).
; PROVISIONAL: placement is derived from the mesh bounds and must be calibrated
; on a headset. Scale = model units -> metres; offsets are hand-local metres.
NativeHands=1
NativeHandScale=0.033
NativeHandOffsetX=0
NativeHandOffsetY=0
NativeHandOffsetZ=0
; GH #64: hand-local orientation correction (degrees) for the native mesh's
; provisional axis basis; tune on a headset. 0 = the inferred basis (ADR-0427).
NativeHandYaw=0
NativeHandPitch=0
NativeHandRoll=0
; GH #61: bind the real Riddick skin/scar diffuse (baked from Models.xtc) on
; the native hand mesh under the lit colour. 1 = textured (recommended).
; VFlip is PROVISIONAL and must be validated on a headset (0 = keep baked UVs).
; GH #61: if the hand still reads white, paste the `NativeHand GL state:` line
; from the log into the issue.
NativeHandTexture=1
NativeHandTextureVFlip=0
; GH #58: draw the offline-POSED mesh variant (baked from a shipped first-person
; .xsa clip; ADR-0443) instead of the bind T-pose geometry. 0 = bind (default).
; PROVISIONAL: the baked pose is an evidence-backed but unvalidated VR fit.
NativeHandPose=0
; GH #64: 1 = also draw the IK upper-arm tube (shoulder to elbow) with native
; hands. 0 = off (the tube does not join the native mesh and reads as a stray block).
NativeHandUpperArm=0
; GH #46: 1 = fade the hands to 25% while a weapon is held (trigger or two-handed
; grip); a boxer guard never fades. 0 = never fade.
HandFadeWhenWeapon=1
; GH #62: front-of-HMD block/guard window (head-local metres relative to the HMD:
; +Y up, -Z forward). Block is the fists held in front of the face; a hold below
; the view (e.g. Y=-0.30) is a rest pose, not a block. A fast swing outside this
; window always fires. Tune on a headset.
GuardYMin=-0.16
GuardYMax=0.32
GuardZMin=-0.60
GuardZMax=-0.12
GuardMaxHandSpan=0.50
; GH #65: swing-driven strike thresholds (m/s) + hand positions (head-local m).
; A punch fires on controller velocity, not a trigger chord. Defaults reproduce
; the first pass exactly; tune here if jabs/hooks/uppercuts feel too stiff or
; fire on a guard raise. StrikeForwardMaxZ is the hand-ahead-of-view gate (m);
; StrikeUppercutMaxY is the "started below the view" gate (m).
StrikeForwardVz=-1.20
StrikeForwardMaxZ=-0.10
StrikeHookVx=1.35
StrikeHookVz=-0.15
StrikeUppercutVy=1.35
StrikeUppercutMaxY=-0.10
StrikeUppercutVz=-0.20
StrikeCrossVx=1.10
; GH #65: 1 = rotate the controller's world velocity into the headset's yaw
; frame before classifying a swing, so punches register whichever way you face.
; 0 = legacy world axes (only works when facing stage -Z).
HeadLocalVelocity=1
; GH #65: how long (ms, 0-250) a melee click stays held. 0 = legacy instant
; down+up, which the game's polled input often misses.
MeleeClickHoldMs=60
; GH #62: the guard pose must hold this long (ms) to engage the block.
GuardEngageMs=40
; GH #62: once engaged, the block survives losing the pose for this long (ms),
; so hand jitter does not drop it. A real punch still releases it at once.
GuardReleaseMs=80
; GH #62: hands count as steady below this speed (m/s) for the guard pose.
GuardSteadySpeed=1.4
; GH #52: combat stance (both triggers squeezed): enter above this trigger value,
; leave below the exit value, after holding for StanceHoldMs. Exit stays below enter.
StanceEnterTrigger=0.85
StanceExitTrigger=0.60
StanceHoldMs=100
; GH #52: 1 = swings only count while in the combat stance (exploration mode
; ignores them). 0 = a swing always punches.
MeleeRequiresStance=0
; GH #66 (approach 2): suppress the ENGINE's own first-person viewmodel
; (arms/hands) at the draw level, so only the VR/native hands are visible.
; Default 0 (off). Approach 1 (the RPG `noviewmodel` bit) was proven inert
; (ADR-0438), so this is the remaining path. The pass signature is PROVISIONAL:
; it suppresses draws inside a mid-frame depth-only-clear window (the classic
; first-person boundary). Leave 0 until the counters have been checked on a
; headset in one run; then enable and confirm no world geometry is dropped.
SuppressEngineViewmodel=0
; Which boundary opens the suppression window: 1 = mid-frame depth-only clear
; (default), 0 = never open (inert even when SuppressEngineViewmodel=1).
ViewmodelDepthClearWindow=1
; GH #63/#66: log the engine's per-frame GL pass signature every 300 frames
; ("Viewmodel pass trace"). Tokens: C colour clear, D depth-only clear, P<near>
; perspective load, O ortho load, d<n> draw run. Paste it in the issue to pin
; the real first-person pass boundary. 0 = off.
ViewmodelTrace=0
; GH #66: what opens the viewmodel window. -1 = derive from
; ViewmodelDepthClearWindow; 0 none, 1 depth-only clear, 2 near-plane drop
; (a perspective load with a much shorter near plane), 3 either.
ViewmodelWindowOpener=-1
; GH #66: near-plane-drop opens when near < worldNear * this (0.05 - 0.95).
ViewmodelNearRatio=0.5
; GH #67: drive the engine's own arms with the dominant controller instead of
; hiding them. Opt-in, experimental; ignored while SuppressEngineViewmodel=1.
; Needs a headset run to tune the values below.
DriveEngineViewmodel=0
; GH #67: engine units per metre (provisional 30.3 ~ 1/0.033).
ViewmodelUnitsPerMeter=30.3
; GH #67: where the engine draws the viewmodel, in head space (metres, -Z forward).
ViewmodelAnchorX=0.18
ViewmodelAnchorY=-0.22
ViewmodelAnchorZ=-0.38
; GH #67: extra rotation on the controller orientation (degrees).
ViewmodelDriveYaw=0
ViewmodelDrivePitch=0
ViewmodelDriveRoll=0
